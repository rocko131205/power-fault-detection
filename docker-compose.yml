services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: propel
      POSTGRES_USER: propel
      POSTGRES_PASSWORD: propel123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propel"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: propel
      DB_USER: propel
      DB_PASSWORD: propel123
      PORT: 3001
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "node src/db/seed.js && node src/index.js"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
